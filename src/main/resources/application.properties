spring.application.name=crud

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/students
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Redis Configuration (default localhost:6379)
spring.redis.host=localhost
spring.redis.port=6379

# Cache TTL in seconds for simple student DTOs
app.cache.student-simple.ttl=300

# JWT Configuration
app.jwt.secret=MyVerySecureJWTSecretKeyFor32CharacterMinimumHS256Signing
app.jwt.expiration=86400000

# Server port
server.port=8082

